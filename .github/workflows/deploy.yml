name: Deploy to GitHub Pages

# Pushing to main automatically builds web/ and publishes it to GitHub Pages; can also be triggered manually from the Actions page
on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions required for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Run only one deployment at a time; a new push cancels the in-progress one
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web # the front-end app lives in the web/ subdirectory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build # tsc -b && vite build → web/dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist # relative to the repo root (uses steps aren't affected by working-directory)

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
